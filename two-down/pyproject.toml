[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twodown"
version = "0.1.0"
description = "Two cryptic clues a day from Fifteen Squared, spoken for YouTube."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "edge-tts>=7.0",
  "lxml>=5.0",
  "pillow>=10.0",
  "pydantic>=2.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
twodown = "twodown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
