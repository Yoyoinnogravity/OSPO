name: Cryptic AI for Fun daily

on:
  schedule:
    # 09:00 and 12:00 Europe/London while BST (UTC+1). Close enough in winter.
    - cron: "0 8 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      youtube_privacy:
        description: YouTube privacy for this run
        type: choice
        options: [unlisted, public, private]
        default: unlisted

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cryptic-ai-daily
  cancel-in-progress: false

jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, fonts, and twodown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          python3 -m pip install -e "./two-down"

      - name: Cut today's pair and upload if a token is set
        env:
          TWODOWN_YOUTUBE_TOKEN: ${{ secrets.TWODOWN_YOUTUBE_TOKEN }}
          TWODOWN_META_TOKEN: ${{ secrets.TWODOWN_META_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.youtube_privacy }}"
          if [ -z "$PRIVACY" ]; then
            PRIVACY=public
          fi
          python3 -m twodown today --youtube-privacy "$PRIVACY"
          python3 -m twodown status

      - name: Open a site PR when the pair is new
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- two-down/site; then
            echo "Site unchanged."
            exit 0
          fi
          DATE=$(date -u +%F)
          BRANCH="cryptic-ai-daily-$DATE"
          git config user.name "cryptic-ai-daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add two-down/site
          git commit -m "Cryptic AI for Fun · $DATE"
          git push -u origin "$BRANCH"
          gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q . \
            || gh pr create --base main --head "$BRANCH" --title "Cryptic AI for Fun · $DATE" --body "Daily pair from Fifteen Squared. YouTube / Facebook / Instagram upload ran if the matching repo secrets were set."
