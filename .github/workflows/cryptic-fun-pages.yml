name: cryptic.fun

on:
  push:
    branches: [main]
    paths:
      - "two-down/site/**"
      - ".github/workflows/cryptic-fun-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cryptic-fun-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # CNAME forces the custom domain. Until cryptic.fun is registered it would
      # redirect the free github.io URL at dead DNS, so publish without it.
      - name: Use the custom domain only when CRYPTIC_FUN_DOMAIN is set
        run: |
          if [ -z "${{ vars.CRYPTIC_FUN_DOMAIN }}" ]; then
            rm -f two-down/site/CNAME
            echo "Publishing on github.io (no custom domain)."
          else
            echo "${{ vars.CRYPTIC_FUN_DOMAIN }}" > two-down/site/CNAME
            echo "Publishing on ${{ vars.CRYPTIC_FUN_DOMAIN }}."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: two-down/site
      - id: deploy
        uses: actions/deploy-pages@v4
