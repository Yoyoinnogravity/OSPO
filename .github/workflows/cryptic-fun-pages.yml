name: cryptic.fit

on:
  push:
    branches: [main]
    paths:
      - "two-down/site/**"
      - ".github/workflows/cryptic-fun-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cryptic-fun-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Aled owns cryptic.fit. Override with CRYPTIC_FUN_DOMAIN if that changes.
      - name: Publish on the Namecheap domain
        run: |
          DOMAIN="${{ vars.CRYPTIC_FUN_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then
            DOMAIN=cryptic.fit
          fi
          echo "$DOMAIN" > two-down/site/CNAME
          echo "Publishing on $DOMAIN."
      - name: Build needs-upload zip parts from published mp4s
        run: |
          PYTHONPATH=two-down/src python3 - <<'PY'
          from pathlib import Path
          from twodown.staging import (
              refresh_upload_lists,
              refresh_upload_zip_bar,
              sync_channel_uploads,
              write_needs_upload_zips,
          )

          root = Path("two-down/site")
          try:
              desk = sync_channel_uploads(root)
              print(
                  "On YouTube {there}; pending {pending}; not decided {undecided}".format(
                      there=len(desk["there"]),
                      pending=len(desk["pending"]),
                      undecided=len(desk["undecided"]),
                  )
              )
          except Exception as exc:
              print(f"Channel feed skipped: {exc}")
          refresh_upload_lists(root)
          written = write_needs_upload_zips(root)
          refresh_upload_zip_bar(root)
          if not written:
              print("No pending Shorts; no zip parts.")
          for path in written:
              raw = path.read_bytes()[:4]
              if raw[:2] != b"PK":
                  raise SystemExit(f"{path.name} is not a PK zip: {raw!r}")
              if b"git-lfs.github.com" in path.read_bytes()[:200]:
                  raise SystemExit(f"{path.name} looks like a Git LFS pointer")
              print(f"{path.name} {path.stat().st_size} bytes magic={raw!r}")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: two-down/site
      - id: deploy
        uses: actions/deploy-pages@v4
