name: cryptic.fit daily

on:
  schedule:
    # 09:00 and 12:00 Europe/London while BST (UTC+1). Shift to 7/10 UTC in GMT.
    - cron: "0 8 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: Upload one published Short (e.g. guardian-30108-27a). Skips cutting.
        type: string
        default: ""
      skip_cut:
        description: Skip twodown today; only upload (today's pair or --slug)
        type: boolean
        default: false
      youtube_privacy:
        description: YouTube privacy for this run
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cryptic-fit-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, fonts, and twodown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          python3 -m pip install -e "./two-down"

      - name: Cut today's pair from Fifteen Squared
        if: ${{ github.event.inputs.slug == '' && github.event.inputs.skip_cut != 'true' }}
        env:
          TWODOWN_YOUTUBE_TOKEN: ${{ secrets.TWODOWN_YOUTUBE_TOKEN }}
          TWODOWN_META_TOKEN: ${{ secrets.TWODOWN_META_TOKEN }}
          TWODOWN_TIKTOK_TOKEN: ${{ secrets.TWODOWN_TIKTOK_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.youtube_privacy }}"
          if [ -z "$PRIVACY" ]; then
            PRIVACY=public
          fi
          python3 -m twodown today --youtube-privacy "$PRIVACY" || {
            echo "No new pair yet (15² may be late). Scheduled run will retry."
            exit 0
          }

      - name: Upload one published Short
        if: ${{ github.event.inputs.slug != '' }}
        id: youtube_slug
        continue-on-error: true
        env:
          TWODOWN_YOUTUBE_TOKEN: ${{ secrets.TWODOWN_YOUTUBE_TOKEN }}
          TWODOWN_META_TOKEN: ${{ secrets.TWODOWN_META_TOKEN }}
          TWODOWN_TIKTOK_TOKEN: ${{ secrets.TWODOWN_TIKTOK_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.youtube_privacy }}"
          python3 -m twodown status
          python3 -m twodown upload \
            --slug "${{ github.event.inputs.slug }}" \
            --no-tiktok --no-instagram --no-facebook \
            --youtube-privacy "$PRIVACY"

      - name: Upload today's pair only
        if: ${{ github.event.inputs.slug == '' && github.event.inputs.skip_cut == 'true' }}
        id: youtube_today
        continue-on-error: true
        env:
          TWODOWN_YOUTUBE_TOKEN: ${{ secrets.TWODOWN_YOUTUBE_TOKEN }}
          TWODOWN_META_TOKEN: ${{ secrets.TWODOWN_META_TOKEN }}
          TWODOWN_TIKTOK_TOKEN: ${{ secrets.TWODOWN_TIKTOK_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.youtube_privacy }}"
          python3 -m twodown status
          python3 -m twodown upload --no-tiktok --no-instagram --no-facebook --youtube-privacy "$PRIVACY"

      - name: Open a site PR when the pair changed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- two-down/site; then
            echo "Site unchanged."
            exit 0
          fi
          DATE=$(date -u +%F)
          BRANCH="cryptic-fit-daily-$DATE"
          git config user.name "cryptic-fit-daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add two-down/site
          git commit -m "cryptic.fit · $DATE"
          git push -u origin "$BRANCH"
          gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q . \
            || gh pr create --base main --head "$BRANCH" \
              --title "cryptic.fit · $DATE" \
              --body "Daily pair from [Fifteen Squared](https://fifteensquared.net/). YouTube upload ran in Actions when \`TWODOWN_YOUTUBE_TOKEN\` is set."

      - name: Report missing YouTube token
        if: |
          always() &&
          (steps.youtube_slug.outcome == 'failure' || steps.youtube_today.outcome == 'failure')
        run: |
          echo "::warning::YouTube upload failed or TWODOWN_YOUTUBE_TOKEN is missing."
          echo "Add the authorized-user JSON from twodown youtube-auth as a repo secret."
